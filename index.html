<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventário Moderno</title>
	<link rel="icon" type="image/png" href="https://i.postimg.cc/kGF5y3N0/MEU2-(36).png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Biblioteca de Ícones (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-purple-300 via-pink-100 to-orange-300 dark:bg-gradient-to-br dark:from-slate-950 dark:via-purple-950/60 dark:to-orange-950/60 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">

    <!-- ================= BOTÃO DE ALTERNÂNCIA DE TEMA (GLOBAL) ================= -->
    <button onclick="toggleTheme()" class="absolute top-4 right-4 p-2.5 bg-white/80 dark:bg-slate-900/85 border border-purple-200 dark:border-slate-800 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 transition cursor-pointer shadow-sm backdrop-blur-sm" title="Alternar Modo Claro/Escuro">
        <i id="theme-icon" data-lucide="sun" class="w-5 h-5"></i>
    </button>

    <!-- ================= TELA 1: LOGIN (COM A FOTO/LOGO) ================= -->
    <div id="login-screen" class="w-full max-w-md p-8 bg-white/90 dark:bg-slate-900/90 border border-purple-200 dark:border-slate-800 rounded-2xl shadow-2xl text-center backdrop-blur-md transition-colors">
        <div class="mb-6 flex flex-col items-center">
            
            <!-- AQUI É ONDE A FOTO/LOGOTIPO APARECE -->
            <div class="w-32 h-25 mb-4 rounded-2xl overflow-hidden shadow-md border border-purple-200 dark:border-slate-700 bg-purple-50 dark:bg-slate-800 flex items-center justify-center">
                <!-- Substitua o 'src' abaixo pelo link da sua foto/logo ou caminho do arquivo -->
                <img src="https://i.postimg.cc/kGF5y3N0/MEU2-(36).png" alt="Logo da Aba" class="w-full h-full object-cover">
            </div>

            <h1 class="text-2xl font-bold tracking-tight">Controle de Inventário</h1>
            <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Digite sua senha para acessar o sistema</p>
        </div>
        
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 bg-purple-50/50 dark:bg-slate-950/80 border border-purple-200 dark:border-slate-800 rounded-xl focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-center text-xl tracking-widest placeholder:text-slate-400 dark:placeholder:text-slate-600 transition">
            </div>
            <button type="submit" 
                class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium rounded-xl transition shadow-lg shadow-purple-600/20 cursor-pointer">
                Acessar Painel
            </button>
            <p id="error-msg" class="text-xs text-rose-500 hidden mt-2">Senha incorreta. Tente novamente.</p>
        </form>
    </div>

    <!-- ================= TELA 2: SELEÇÃO DE ÁREAS (SETORES) ================= -->
    <div id="dashboard-screen" class="hidden w-full max-w-5xl p-4">
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-bold tracking-tight">Setores do Inventário</h2>
            <p class="text-slate-700 dark:text-slate-300 mt-1">Selecione o setor que deseja consultar</p>
        </div>

        <!-- Grade Dinâmica de Setores -->
        <div id="sectors-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Preenchido via JavaScript -->
        </div>
    </div>

    <!-- ================= TELA 3: LISTAGEM DOS ITENS DE INVENTÁRIO ================= -->
    <div id="list-screen" class="hidden w-full max-w-6xl p-6 bg-white/90 dark:bg-slate-900/90 border border-purple-200 dark:border-slate-800 rounded-2xl shadow-2xl backdrop-blur-md transition-colors">
        <!-- Cabeçalho da Lista com Botão de Voltar -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-6 border-b border-purple-100 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <button onclick="goBackToDashboard()" class="p-2 bg-purple-50 dark:bg-slate-800 hover:bg-purple-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl transition cursor-pointer" title="Voltar para Setores">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div>
                    <h2 id="list-title" class="text-2xl font-bold tracking-tight">Setor</h2>
                    <p class="text-sm text-slate-600 dark:text-slate-400">Itens patrimoniados cadastrados neste local</p>
                </div>
            </div>
        </div>

        <!-- Tabela Moderna de Inventário -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-purple-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-xs uppercase tracking-wider">
                        <th class="py-3 px-4 font-semibold">Nº (Tombo)</th>
                        <th class="py-3 px-4 font-semibold">Item</th>
                        <th class="py-3 px-4 font-semibold">Marca / Modelo</th>
                        <th class="py-3 px-4 font-semibold">Cor</th>
                        <th class="py-3 px-4 font-semibold">Observações</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-purple-50 dark:divide-slate-800/60 text-sm text-slate-700 dark:text-slate-300">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

            {"A": "COMERCIAL", "B": "0102", "C": "SMARTPHONE", "D": "SAMSUNG - A20S - IMEI(351840113434710)", "E": "PRETO", "F": ""},

            {"A": "SALA CEO", "B": "0120", "C": "PERSIANA", "D": "EB LUX", "E": "BRANCO", "F": ""}
        ];

        const inventoryData = {};
        rawData.forEach(row => {
            if (row.A === "LOCAL" || row.B === "Nº") return;
            const sector = row.A || "OUTROS";
            if (!inventoryData[sector]) {
                inventoryData[sector] = [];
            }
            inventoryData[sector].push({
                id: row.B,
                item: row.C,
                modelo: row.D,
                cor: row.E,
                obs: row.F || "-"
            });
        });

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
            } else {
                html.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        }

        function renderSectors() {
            const grid = document.getElementById('sectors-grid');
            grid.innerHTML = "";

            Object.keys(inventoryData).sort().forEach(sector => {
                const count = inventoryData[sector].length;
                grid.innerHTML += `
                    <div onclick="openArea('${sector}')" class="group p-6 bg-white/90 dark:bg-slate-900/85 border border-purple-200 dark:border-slate-800 rounded-2xl cursor-pointer hover:border-purple-500 hover:bg-white dark:hover:bg-slate-900 transition-all duration-300 hover:-translate-y-1 shadow-xl backdrop-blur-sm flex items-center justify-between">
                        <div>
                            <div class="w-10 h-10 bg-purple-600/10 text-purple-600 dark:text-orange-400 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                <i data-lucide="folder-kanban" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200">${sector}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${count} item(ns) cadastrado(s)</p>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 dark:text-slate-600 group-hover:text-purple-600 dark:group-hover:text-orange-400 transition-colors"></i>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (password === "wick@admin") {
                errorMsg.classList.add('hidden');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                renderSectors();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function openArea(areaName) {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('list-screen').classList.remove('hidden');
            
            document.getElementById('list-title').innerText = "Setor: " + areaName;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = ""; 

            const items = inventoryData[areaName] || [];
            
            items.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-purple-50/50 dark:hover:bg-slate-800/40 transition">
                        <td class="py-3 px-4 font-mono text-xs text-purple-600 dark:text-orange-400 font-bold">#${item.id}</td>
                        <td class="py-3 px-4 font-medium text-slate-800 dark:text-slate-200">${item.item}</td>
                        <td class="py-3 px-4 text-slate-500 dark:text-slate-400 text-xs">${item.modelo}</td>
                        <td class="py-3 px-4 text-slate-500 dark:text-slate-400 text-xs">${item.cor}</td>
                        <td class="py-3 px-4 text-slate-400 dark:text-slate-500 text-xs">${item.obs}</td>
                    </tr>
                `;
            });

            lucide.createIcons();
        }

        function goBackToDashboard() {
            document.getElementById('list-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        lucide.createIcons();
    </script>
</body>
</html>
